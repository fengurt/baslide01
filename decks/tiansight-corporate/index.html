<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>侍天 TIANSIGHT · 企业介绍</title>
<style>
  :root{--surface:#F4F0E7;--paper:#FFFDF8;--ink:#17130D;--gold:#76551F;--muted:#706758;--line:rgba(23,19,13,.18)}
  *{box-sizing:border-box} body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--surface);color:var(--ink);font-family:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif}
  main{width:min(760px,calc(100% - 48px));padding:64px 0} header{display:grid;grid-template-columns:72px 1fr;gap:24px;align-items:center;margin-bottom:36px}
  img{width:72px;height:72px;object-fit:contain} .cap{margin:0 0 8px;color:var(--gold);font-size:12px;letter-spacing:.3em} h1{margin:0;font-size:42px;line-height:1.12;font-weight:600}
  p{margin:12px 0 0;color:var(--muted);line-height:1.7} nav{display:grid;gap:12px} a{display:block;padding:20px 22px;border:1px solid var(--line);background:var(--paper);color:inherit;text-decoration:none}
  a:hover{border-color:var(--gold)} b{display:block;font-size:20px;margin-bottom:6px} span{color:var(--muted);font-size:14px}
  @media(max-width:600px){header{grid-template-columns:52px 1fr;gap:16px}img{width:52px;height:52px}h1{font-size:32px}}
</style>
</head>
<body>
<main>
  <header>
    <img src="assets/tiansight-logo.png" alt="侍天">
    <div><p class="cap">TIANSIGHT</p><h1>侍天企业介绍</h1><p>包含 Landing Page 长图与完整企业介绍。</p></div>
  </header>
  <nav>
    <a href="one-pager.html"><b>Landing Page 长图</b><span>响应式页面 / 支持导出 PNG</span></a>
    <a href="company-profile.html"><b>企业介绍</b><span>15 页 / A4 portrait</span></a>
  </nav>
</main>
</body>
</html>
